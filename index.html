<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de usuario</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="contenedor">
        <section class="tarjeta" aria-labelledby="titulo-formulario">
            <p class="etiqueta-superior">Actividad 1 · Aplicación dinámica</p>
            <h1 id="titulo-formulario">Registro de usuario</h1>
            <p class="introduccion">
                Completa los siguientes datos para generar una respuesta personalizada.
            </p>

            <form action="procesar.php" method="POST">
                <div class="campo">
                    <label for="nombre">Nombre completo</label>
                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        placeholder="Ejemplo: Andrea López"
                        autocomplete="name"
                        maxlength="80"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="edad">Edad</label>
                    <input
                        type="number"
                        id="edad"
                        name="edad"
                        placeholder="Ejemplo: 25"
                        min="1"
                        max="120"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="correo">Correo electrónico</label>
                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        placeholder="nombre@ejemplo.com"
                        autocomplete="email"
                        maxlength="120"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="pais">País</label>
                    <select id="pais" name="pais" required>
                        <option value="" selected disabled>Selecciona un país</option>
                        <option value="mexico">México</option>
                        <option value="canada">Canadá</option>
                        <option value="colombia">Colombia</option>
                        <option value="espana">España</option>
                        <option value="estados_unidos">Estados Unidos</option>
                    </select>
                </div>

                <button type="submit">Procesar información</button>
            </form>
        </section>
    </main>
</body>
</html>
